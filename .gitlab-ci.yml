image: rustlang/rust:nightly

stages:
  - build
  - test
  - deploy

cache: {}

ribosome-build:
  stage: build
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
  script:
    - cargo build
  artifacts:
    paths:
      - .cargo
      - target
    expire_in: 12 hours

ribosome-test:
  stage: test
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
  dependencies:
    - ribosome-build
  script:
    - RELEASE_PKG=dais-ribosome-cli perl .github/scripts/check_versions_changelog.pl
    - cargo test
    - cargo doc --no-deps --document-private-items

pages:
  stage: deploy
  image: rustlang/rust:nightly
  tags:
    - pages
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - cargo doc --no-deps --document-private-items
    - mv target/doc public/
    - echo "<meta http-equiv=\"refresh\" content=\"0; url=dais_ribosome\">" > public/index.html
  artifacts:
    paths:
      - public
