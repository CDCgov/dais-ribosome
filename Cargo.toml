[package]
name = "dais-ribosome"
version = "2.0.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "*"
toml = "*"
serde = "*"
serde_derive = "*"
zoe = { git = "https://git.biotech.cdc.gov/vfn4/zoe.git", branch = "main", default-features = false, features = [
    "multiversion",
] }
rand = { version = "0.9", default-features = false, features = ["thread_rng"] }

[[bin]]
bench = false
path = "src/main.rs"
name = "ribosome"
